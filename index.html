function cus(){return `<div class="f"><input placeholder="Cari nama, no. telp, atau produk…" value="${E(cq)}" oninput="cq=this.value;cl()"><select onchange="cs=this.value;cl()"><option value="a" ${cs=='a'?'selected':''}>Urut: Total pembelian</option><option value="d" ${cs=='d'?'selected':''}>Urut: Terbaru</option><option value="n" ${cs=='n'?'selected':''}>Urut: Nama A–Z</option></select></div><p class="mu" id="cn"></p><div id="cl"></div>`}
function cl(){const s=cq.toLowerCase(),A=custs().filter(c=>!s||(Object.keys(c.names).join(' ')+' '+c.ps.map(n=>pf(n)+' '+n+' 0'+n.slice(2)).join(' ')+' '+Object.values(c.pr).map(x=>x.it).join(' ')).toLowerCase().includes(s)).sort((a,b)=>cs=='a'?b.a-a.a:cs=='d'?b.last.localeCompare(a.last):a.n.localeCompare(b.n));
$('#cn').textContent=`${A.length} customer · ${A.filter(c=>c.p).length} punya no. telp · total ${R(A.reduce((t,c)=>t+c.a,0))}`;
$('#cl').innerHTML=A.slice(0,200).map(c=>{const pr=Object.values(c.pr).sort((a,b)=>b.q-a.q||b.a-a.a),al=Object.keys(c.names).filter(x=>x!=c.n);
return `<details class="cc"><summary><div class="r1"><b>${E(c.n)}</b><b>${R(c.a)}</b></div><div class="r2"><span>${c.ps[0]?pf(c.ps[0])+(c.ps.length>1?' · +'+(c.ps.length-1)+' nomor':''):'Tanpa no. telp'}</span><span>${c.o.length} SPO · ${c.last.slice(8)}/${c.last.slice(5,7)}/${c.last.slice(2,4)}</span></div></summary><div class="cd">${c.ps.length?`<h4>Kontak</h4>${c.ps.map(n=>`<div class="ph"><span>${pf(n)}</span><a class="b" href="tel:+${n}" target="_blank" rel="noopener">Telepon</a><a class="b" href="https:${SL}wa.me/${n}" target="_blank" rel="noopener">WhatsApp</a></div>`).join('')}`:''}${al.length?`<p class="mu">Nama lain: ${E(al.join(', '))}</p>`:''}<h4>Produk dibeli</h4>${pr.map(x=>`<div class="ln"><span>${E(x.it)}</span><span>${x.q}× · ${J(x.a)}</span></div>`).join('')||'<p class="mu">—</p>'}<h4>Riwayat pembelian</h4>${c.o.sort((a,b)=>b.d.localeCompare(a.d)).map(o=>`<div class="ln"><span>${o.d.slice(8)}/${o.d.slice(5,7)} · ${E(o.s.slice(-5))}</span><span>${R(o.a)}</span></div>`).join('')}</div></details>`}).join('')+(A.length>200?'<p class="mu">Menampilkan 200 teratas — gunakan pencarian.</p>':'')}
function dep(l){const o={};l.forEach(x=>o[x.dp]=(o[x.dp]||0)+x.a);return o}
function chg(s,v){if(!confirm('Ubah semua barang SPO '+s+' menjadi '+v+'?')){draw();return}rpc('setStatus',[s,v],()=>load(true),e=>{alert(e.message);draw()})}
function chgl(i,v){const x=L[i];rpc('setLineStatus',[x.sh,x.r,x.s,v],()=>load(true),e=>{alert(e.message);draw()})}
function load(f){$('#v').innerHTML='<p class="mu">Memuat data…</p>';
rpc('getAll',[!!f],o=>{const d=o.d;L=d;DT=o.dept||{};PR=o.prod||[];TS=o.ts||0;const M={};d.forEach(x=>{const o=M[x.s]||(M[x.s]={d:x.d,s:x.s,c:x.c,sa:x.sa,ko:'',tl:'',t2:'',a:0,k:0,t:0,its:[]});o.a+=x.a;o.k++;if(x.st==2)o.t++;if(!o.sa)o.sa=x.sa;if(!o.ko)o.ko=x.ko;if(!o.tl)o.tl=x.t1;if(!o.t2)o.t2=x.t2;o.its.push(x)});rows=Object.values(M).map(o=>({...o,st:o.t==0?0:o.t==o.k?2:1}));draw()},e=>{$('#v').innerHTML='<p class="mu">Gagal memuat: '+E(e.message)+'</p>'})}
const SL=String.fromCharCode(47,47);
let TK='';
let API=(window.API_URL||'').trim();try{API=API||(localStorage.getItem('si_api')||'')}catch(e){}
async function call(fn,args){let r;try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args}),redirect:'follow',credentials:'omit'})}catch(e){throw new Error(await why())}
let j;try{j=await r.json()}catch(e){throw new Error('Respons server tidak valid. Pastikan alamat API benar dan akses Web App diatur ke Anyone.')}
if(!j.ok)throw new Error(j.e||'Terjadi kesalahan.');return j.v}
async function why(){const h='Tidak dapat terhubung ke server. ';
if(/ALAMAT_ANDA/.test(API))return h+'Alamat API di config.js masih berisi contoh (ALAMAT_ANDA). Ganti dengan alamat Web App Anda.';
if(!/^https:/.test(API))return h+'Alamat API tidak valid (harus diawali https dan berakhiran /exec).';
if(!navigator.onLine)return h+'Tidak ada koneksi internet.';
try{await fetch(API,{mode:'no-cors',credentials:'omit'});return h+'Server terjangkau tetapi permintaan ditolak. Periksa: (1) alamat berakhiran /exec dan benar, (2) akses Web App diatur ke Anyone, (3) sudah Deploy dengan Version: New version.'}
catch(e){return h+'Alamat API tidak dapat dijangkau. Periksa alamat di config.js dan koneksi internet.'}}
function rpc(fn,a,ok,bad){call(fn,[TK,...a]).then(ok,e=>{if(/Sesi/.test(e.message)){out(true);return}(bad||(x=>alert(x.message)))(e)})}
function saveApi(){const u=$('#au').value.trim();if(!/^https:/.test(u))return $('#lm').textContent='Alamat API harus diawali https';try{localStorage.setItem('si_api',u)}catch(e){}API=u;$('#ap').hidden=true;$('#lm').textContent='Alamat tersimpan. Silakan masuk.'}
function instApp(){const d=window.__dp;if(d){d.prompt();window.__dp=null;$('#inst').hidden=true}}
let ME={u:'',r:'user',sa:''};
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):'';
function show(){document.documentElement.classList.remove('chk');const on=!!TK&&!!ME.u;$('#lg').hidden=on;$('#app').hidden=!on}
function applyMe(){const a=ME.r=='admin';$('#gear').hidden=!a;$('#spf').hidden=!a;sp=a?'':ME.sa}
function enter(){applyMe();show();load()}
function out(x){TK='';ME={u:'',r:'user',sa:''};try{localStorage.removeItem('si_tk')}catch(e){}rows=[];L=[];DT={};PR=[];sp='';closeSet();show();$('#lm').textContent=x===true?'Sesi berakhir, silakan masuk lagi.':''}
function lgn(){const u=$('#lu').value.trim(),p=$('#lp').value;if(!API){$('#ap').hidden=false;return $('#lm').textContent='Isi alamat API terlebih dahulu.'}if(!u||!p)return $('#lm').textContent='Isi username dan password.';
$('#lb').disabled=true;$('#lm').textContent='Memeriksa…';
call('login',[u,p]).then(o=>{TK=o.t;ME={u:o.u,r:o.r,sa:o.sa};$('#lb').disabled=false;$('#lp').value='';$('#lm').textContent='';try{localStorage.setItem('si_tk',o.t)}catch(e){}enter()},e=>{$('#lb').disabled=false;$('#lm').textContent=e.message})}
const EYE='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>',EYX='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>';
function eye(id,b){const i=$('#'+id),s=i.type=='password';i.type=s?'text':'password';b.innerHTML=s?EYX:EYE;b.setAttribute('aria-label',s?'Sembunyikan password':'Lihat password')}
let UL=[];
function openSet(){$('#st').hidden=false;$('#sm').textContent='';clearU();rpc('listUsers',[],u=>{UL=u;rs()})}
function closeSet(){$('#st').hidden=true}
function rr(){$('#ssr').hidden=$('#sr').value!='user'}
function rs(){$('#sal').innerHTML=[...new Set(rows.map(r=>r.sa).filter(Boolean))].sort().map(s=>`<option value="${E(s)}">`).join('');
$('#ul').innerHTML=UL.length?`<div class="ul">${UL.map((u,i)=>{const a=u.role=='admin';return `<div class="ur"><span class="av${a?' ad':''}">${E(cap(u.u).charAt(0))}</span><div class="ui"><b>${E(cap(u.u))}</b><small>${a?'Admin · Store Leader':'Sales Person · '+E(u.sa)}</small></div><div class="ua"><button class="ib" onclick="editU(${i})" aria-label="Ubah ${E(u.u)}" title="Ubah"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button><button class="ib dl" onclick="delU(${i})" aria-label="Hapus ${E(u.u)}" title="Hapus"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg></button></div></div>`}).join('')}</div>`:'<p class="mu">Belum ada user.</p>'}
function editU(i){const u=UL[i];$('#su').value=u.u;$('#su').readOnly=true;$('#sr').value=u.role;$('#ss').value=u.sa;$('#sw').value='';$('#sw2').value='';$('#sw').placeholder='Password baru (kosongkan jika tidak diubah)';$('#sw2').placeholder='Ulangi password baru';rr();$('#st').scrollTop=0;$('#sm').textContent='Mengubah user "'+u.u+'".'}
function clearU(){$('#su').value='';$('#su').readOnly=false;$('#sw').value='';$('#sw2').value='';$('#sw').placeholder='Password (min. 6 karakter)';$('#sw2').placeholder='Ulangi password';['sw','sw2'].forEach(i=>{$('#'+i).type='password';$('#'+i).nextElementSibling.innerHTML=EYE});$('#sr').value='user';$('#ss').value='';rr()}
function saveU(){const u=$('#su').value.trim();if(!u)return $('#sm').textContent='Isi username.';if($('#sw').value!==$('#sw2').value)return $('#sm').textContent='Konfirmasi password tidak sama. Periksa kembali.';$('#sm').textContent='Menyimpan…';
rpc('saveUser',[u,$('#sw').value,$('#sr').value,$('#ss').value.trim()],r=>{UL=r.users;clearU();rs();$('#sm').textContent='Tersimpan.';
if(r.t){TK=r.t;try{localStorage.setItem('si_tk',r.t)}catch(e){}rpc('me',[],s=>{ME=s;if(ME.r!='admin')closeSet();enter()})}},e=>$('#sm').textContent=e.message)}
function delU(i){const u=UL[i];if(!confirm('Hapus user "'+u.u+'"?'))return;rpc('deleteUser',[u.u],r=>{UL=r;clearU();rs();$('#sm').textContent='User dihapus.'},e=>$('#sm').textContent=e.message)}
$('#lgl').appendChild($('.logo').cloneNode());
$('#lp').onkeydown=e=>{if(e.key=='Enter')lgn()};
$('#lb').onclick=lgn;
try{TK=localStorage.getItem('si_tk')||''}catch(e){}
$('#ap').hidden=!!API;if(window.__dp)$('#inst').hidden=false;
if(TK)rpc('me',[],s=>{ME=s;enter()},e=>{out();$('#lm').textContent='Gagal terhubung: '+e.message});else show();
if('serviceWorker' in navigator)addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
</script></body></html>
