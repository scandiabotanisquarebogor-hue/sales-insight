<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kunjungan Alamat · SCANDIA BOTANI</title>
<script src="../config.js"></script>
<style>
:root{--bg:#f6f5f1;--cd:#fff;--tx:#1d1d1b;--mu:#6b6a65;--ac:#0f6e56;--ln:#e4e2db;--s0:#b91c1c;--s1:#b45309;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--cd:#212120;--tx:#efeee9;--mu:#9a9990;--ac:#3fb98f;--ln:#34342f;--s0:#f87171;--s1:#fbbf24;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
.w{max-width:760px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:20px;margin:0}.mu{color:var(--mu);font-size:13px;margin:4px 0}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.b{border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:9px;padding:9px 13px;font:inherit;font-size:14px;cursor:pointer}
.b.pr{background:var(--ac);border-color:var(--ac);color:#fff}.b:disabled{opacity:.5}
input,select,textarea{border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:9px;padding:9px 11px;font:inherit;font-size:14px;width:100%}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.row>*{flex:1 1 150px;min-width:0}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:11px 13px;margin:8px 0;display:flex;gap:11px;align-items:flex-start}
.card .inf{flex:1;min-width:0;cursor:pointer}
.card .al{font-weight:600;overflow-wrap:anywhere}
.card input[type=checkbox]{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--ac)}
.tag{display:inline-block;font-size:11px;border:1px solid var(--ln);border-radius:9px;padding:0 7px;color:var(--mu);margin-right:4px}
.tag.ok{color:var(--ac);border-color:var(--ac)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet[hidden]{display:none}
.sheet .sc{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chips label{border:1px solid var(--ln);background:var(--cd);border-radius:18px;padding:5px 11px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px}
.chips input{width:auto;accent-color:var(--ac)}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-top:6px}
.fotos a{display:block;border:1px solid var(--ln);border-radius:8px;padding:8px;text-align:center;font-size:12px;color:var(--ac);text-decoration:none;background:var(--cd)}
.sec{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-top:14px}
.sec h3{font-size:14px;margin:0 0 6px}
.grp{border:1px solid var(--ln);border-radius:10px;padding:9px;margin:8px 0;background:var(--bg)}
.grp label{display:flex;align-items:center;gap:7px;font-size:14px;margin:3px 0}
.grp input{width:auto;accent-color:var(--ac)}
.pg{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0}
.pg .mu{margin:0}
[hidden]{display:none!important}
.spn{display:inline-block;width:12px;height:12px;border:2px solid var(--ln);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes spin{to{transform:rotate(360deg)}}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}:focus:not(:focus-visible){outline:none}
</style></head><body>
<div class="w">
  <div class="hd"><div><h1>Kunjungan Alamat</h1><p class="mu" id="who"></p></div><button class="b" id="out" hidden>Keluar</button></div>

  <section id="login" class="sec" style="margin-top:0">
    <h3>Masuk</h3>
    <div class="row"><input id="lu" placeholder="Username" autocapitalize="none" autocomplete="username"><input id="lp" type="password" placeholder="Password" autocomplete="current-password"></div>
    <button class="b pr" id="lb" style="width:100%">Masuk</button>
    <p class="mu" id="lm"></p>
  </section>

  <section id="app" hidden>
    <div class="row">
      <select id="fk" aria-label="Kota"></select>
      <select id="fc" aria-label="Kecamatan"></select>
      <select id="fp" aria-label="Perumahan"></select>
      <select id="fs" aria-label="Status"><option value="all">Semua status</option><option value="belum">Belum dikunjungi</option><option value="sudah">Sudah dikunjungi</option></select>
    </div>
    <input id="q" placeholder="Cari alamat, perumahan, sales, atau catatan…" style="margin-bottom:6px">
    <p class="mu" id="sum"></p>
    <div id="list"></div>
    <div class="pg"><span></span><button class="b" id="more" hidden>Tampilkan lagi</button></div>

    <section class="sec" id="gabungSec" hidden>
      <h3>Gabung nama perumahan yang mirip</h3>
      <p class="mu">Pilih nama tujuan untuk tiap kelompok. Nama lain di kelompok itu akan diganti menjadi nama tujuan di seluruh data.</p>
      <div id="gabung"></div>
      <button class="b" id="cariMirip">Cari nama mirip</button>
    </section>
  </section>
</div>

<div class="sheet" id="sheet" hidden><div class="sc" id="scx"></div></div>
<input type="file" id="fCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fGal" accept="image/*" hidden>

<script>
(function(){
var API=(window.API_URL||'').trim();
var TK=localStorage.getItem('kn_tk')||'', ME={u:'',admin:false}, DATA=null, FIL=[], SHOW=60, CUR=null, PHOTO_KEY=null, PHOTO_INFO=null;
var $=function(s){return document.querySelector(s)};
var E=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};

function call(fn,args){
  if(!API||/ALAMAT_ANDA/.test(API)) return Promise.reject(new Error('Alamat API belum diisi di config.js'));
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),redirect:'follow',credentials:'omit'})
    .catch(function(){throw new Error('Tidak dapat terhubung ke server.')})
    .then(function(r){return r.json().catch(function(){throw new Error('Respons server tidak valid.')})})
    .then(function(j){ if(!j.ok){ if(/Sesi/.test(j.e||'')) logout(true); throw new Error(j.e||'Terjadi kesalahan.'); } return j.v; });
}
function rpc(fn,args){ return call(fn,[TK].concat(args||[])); }

function show(){ var on=!!TK; $('#login').hidden=on; $('#app').hidden=!on; $('#out').hidden=!on; }
function logout(msg){ TK=''; localStorage.removeItem('kn_tk'); DATA=null; show(); $('#lm').textContent=msg===true?'Sesi berakhir, silakan masuk lagi.':''; }

$('#lb').onclick=function(){
  var u=$('#lu').value.trim(), p=$('#lp').value;
  if(!u||!p){$('#lm').textContent='Isi username dan password.';return}
  $('#lb').disabled=true; $('#lm').textContent='Memeriksa login…';
  call('login',[u,p]).then(function(o){ TK=o.t; localStorage.setItem('kn_tk',o.t); ME={u:o.u,admin:o.r==='admin'}; $('#lp').value=''; $('#lb').disabled=false; $('#lm').textContent=''; show(); load(); })
    .catch(function(e){ $('#lb').disabled=false; $('#lm').textContent=e.message; });
};
$('#lp').onkeydown=function(e){ if(e.key==='Enter') $('#lb').click(); };
$('#out').onclick=function(){ logout(false); };

function load(){
  $('#sum').innerHTML='<span class="spn"></span>Memuat data alamat…';
  rpc('kunjunganData',[]).then(function(d){
    DATA=d; ME.admin=!!d.admin; ME.u=d.u;
    $('#who').textContent=d.u+(d.admin?' · Admin':' · Sales')+' — kunjungan alamat';
    $('#gabungSec').hidden=!d.admin;
    buildFilters(); render();
  }).catch(function(e){ $('#sum').textContent=e.message; if(/Sesi/.test(e.message)) logout(true); });
}

function opts(sel,list,val,all){
  sel.innerHTML='<option value="">'+all+'</option>'+list.map(function(x){return '<option value="'+E(x)+'"'+(x===val?' selected':'')+'>'+E(x)+'</option>'}).join('');
}
function uniq(a){return a.filter(function(x,i){return x&&a.indexOf(x)===i}).sort()}
function buildFilters(){
  var A=DATA.alamat;
  var kota=uniq(A.map(function(a){return a.kota}));
  var kk=$('#fk').value; if(kk&&kota.indexOf(kk)<0) kk='';
  opts($('#fk'),kota,kk,'Semua kota');
  var kec=uniq(A.filter(function(a){return !kk||a.kota===kk}).map(function(a){return a.kecamatan}));
  var kc=$('#fc').value; if(kc&&kec.indexOf(kc)<0) kc='';
  opts($('#fc'),kec,kc,'Semua kecamatan');
  var per=uniq(A.filter(function(a){return (!kk||a.kota===kk)&&(!kc||a.kecamatan===kc)}).map(function(a){return a.perumahan}));
  var pp=$('#fp').value; if(pp&&per.indexOf(pp)<0) pp='';
  opts($('#fp'),per,pp,'Semua perumahan');
}
$('#fk').onchange=function(){ $('#fc').value=''; $('#fp').value=''; buildFilters(); SHOW=60; render(); };
$('#fc').onchange=function(){ $('#fp').value=''; buildFilters(); SHOW=60; render(); };
['#fp','#fs'].forEach(function(s){ $(s).onchange=function(){ SHOW=60; render(); }; });
var qt=null; $('#q').oninput=function(){ clearTimeout(qt); qt=setTimeout(function(){ SHOW=60; render(); },200); };

function filtered(){
  var k=$('#fk').value, c=$('#fc').value, p=$('#fp').value, s=$('#fs').value, q=$('#q').value.trim().toLowerCase();
  return DATA.alamat.filter(function(a){
    if(k&&a.kota!==k) return false;
    if(c&&a.kecamatan!==c) return false;
    if(p&&a.perumahan!==p) return false;
    if(s==='belum'&&a.dikunjungi) return false;
    if(s==='sudah'&&!a.dikunjungi) return false;
    if(q){ var t=(a.alamat+' '+a.perumahan+' '+a.kecamatan+' '+a.kota+' '+a.sales.join(' ')+' '+a.catatan+' '+a.hasil).toLowerCase(); if(t.indexOf(q)<0) return false; }
    return true;
  }).sort(function(a,b){return (a.dikunjungi-b.dikunjungi)||a.alamat.localeCompare(b.alamat)});
}

function render(){
  FIL=filtered();
  var sudah=FIL.filter(function(a){return a.dikunjungi}).length;
  $('#sum').textContent=FIL.length+' alamat · sudah '+sudah+' · belum '+(FIL.length-sudah);
  var list=FIL.slice(0,SHOW);
  $('#list').innerHTML=list.map(function(a,i){
    return '<div class="card"><input type="checkbox" data-i="'+i+'" '+(a.dikunjungi?'checked':'')+' aria-label="Sudah dikunjungi"><div class="inf" data-i="'+i+'">'
      +'<div class="al">'+E(a.alamat)+'</div>'
      +'<div class="mu">'+E([a.perumahan,a.kecamatan,a.kota].filter(Boolean).join(' · '))+'</div>'
      +'<div style="margin-top:4px"><span class="tag '+(a.dikunjungi?'ok':'')+'">'+(a.dikunjungi?'✓ Sudah dikunjungi'+(a.tanggal?' · '+a.tanggal:''):'Belum dikunjungi')+'</span>'
      +(a.sales.length?'<span class="tag">'+E(a.sales.join(', '))+'</span>':'')
      +(a.hasil?'<span class="tag">'+E(a.hasil)+'</span>':'')
      +(a.foto.length?'<span class="tag">📷 '+a.foto.length+'</span>':'')+'</div></div></div>';
  }).join('') || '<p class="mu">Tidak ada alamat yang cocok.</p>';
  $('#more').hidden=FIL.length<=SHOW;
  if(FIL.length>SHOW) $('#more').textContent='Tampilkan lagi ('+(FIL.length-SHOW)+' sisa)';
}
$('#more').onclick=function(){ SHOW+=60; render(); };

// centang cepat: langsung simpan
$('#list').addEventListener('change',function(e){
  if(e.target.type!=='checkbox') return;
  var a=FIL[+e.target.dataset.i], on=e.target.checked;
  e.target.disabled=true;
  rpc('kunjunganSimpan',[a.key,info(a),{dikunjungi:on,sales:a.sales,hasil:a.hasil,catatan:a.catatan}]).then(function(r){
    apply(a,{dikunjungi:r.dikunjungi,tanggal:r.tanggal});
  }).catch(function(err){ e.target.checked=!on; alert(err.message); }).then(function(){ e.target.disabled=false; render(); });
});
$('#list').addEventListener('click',function(e){
  var t=e.target.closest('.inf'); if(!t) return;
  openSheet(FIL[+t.dataset.i]);
});

function info(a){ return {alamat:a.alamat,kota:a.kota,kecamatan:a.kecamatan,perumahan:a.perumahan}; }
function apply(a,patch){ for(var k in patch) a[k]=patch[k]; }

function openSheet(a){
  CUR=a;
  var hasilOpt='<option value="">— pilih —</option>'+DATA.hasilOpsi.map(function(h){return '<option'+(a.hasil===h?' selected':'')+'>'+E(h)+'</option>'}).join('');
  var chips=DATA.sales.map(function(s){return '<label><input type="checkbox" value="'+E(s)+'" '+(a.sales.indexOf(s)>=0?'checked':'')+'>'+E(s)+'</label>'}).join('');
  $('#scx').innerHTML=
    '<div class="hd"><div><h3 style="margin:0">'+E(a.alamat)+'</h3><p class="mu">'+E([a.perumahan,a.kecamatan,a.kota].filter(Boolean).join(' · '))+' · '+a.spo+' SPO</p></div><button class="b" id="x">Tutup</button></div>'
    +'<label class="row" style="align-items:center"><input type="checkbox" id="dik" style="width:22px;height:22px;flex:none" '+(a.dikunjungi?'checked':'')+'><span>Sudah dikunjungi</span></label>'
    +'<p class="mu">Sales yang mengunjungi (boleh lebih dari satu)</p><div class="chips" id="chips">'+chips+'</div>'
    +'<p class="mu">Hasil kunjungan</p><select id="hasil">'+hasilOpt+'</select>'
    +'<p class="mu" style="margin-top:8px">Catatan</p><textarea id="catatan" maxlength="500">'+E(a.catatan)+'</textarea>'
    +'<div class="row" style="margin-top:10px"><button class="b pr" id="simpan">Simpan</button></div><p class="mu" id="sm"></p>'
    +'<div class="sec" style="margin-top:12px"><h3>Foto kunjungan</h3><div class="row"><button class="b" id="bCam">📷 Ambil foto</button><button class="b" id="bGal">🖼️ Pilih dari galeri</button></div>'
    +'<div class="fotos" id="fotos">'+a.foto.map(function(u,i){return '<a href="'+E(u)+'" target="_blank" rel="noopener">Foto '+(i+1)+'</a>'}).join('')+'</div>'
    +'<p class="mu" id="fm"></p></div>';
  $('#sheet').hidden=false;
  $('#x').onclick=closeSheet;
  $('#simpan').onclick=saveSheet;
  $('#bCam').onclick=function(){ PHOTO_KEY=a.key; PHOTO_INFO=info(a); $('#fCam').click(); };
  $('#bGal').onclick=function(){ PHOTO_KEY=a.key; PHOTO_INFO=info(a); $('#fGal').click(); };
}
function closeSheet(){ $('#sheet').hidden=true; CUR=null; }
$('#sheet').addEventListener('click',function(e){ if(e.target.id==='sheet') closeSheet(); });

function saveSheet(){
  var a=CUR; if(!a) return;
  var sales=[].map.call(document.querySelectorAll('#chips input:checked'),function(i){return i.value});
  var data={dikunjungi:$('#dik').checked,sales:sales,hasil:$('#hasil').value,catatan:$('#catatan').value.trim()};
  $('#simpan').disabled=true; $('#sm').textContent='Menyimpan…';
  rpc('kunjunganSimpan',[a.key,info(a),data]).then(function(r){
    apply(a,{dikunjungi:r.dikunjungi,tanggal:r.tanggal,sales:r.sales,hasil:r.hasil,catatan:r.catatan});
    $('#sm').textContent='Tersimpan.'; render();
  }).catch(function(e){ $('#sm').textContent=e.message; }).then(function(){ $('#simpan').disabled=false; });
}

// foto: kecilkan dulu di browser agar ringan, lalu kirim
function kecil(file){
  return new Promise(function(res,rej){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var m=1280, s=Math.min(1,m/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg',0.75).split(',')[1]);
    };
    img.onerror=function(){rej(new Error('Foto tidak bisa dibaca.'))};
    img.src=url;
  });
}
function unggah(file){
  if(!file||!PHOTO_KEY) return;
  $('#fm').textContent='Mengunggah foto…';
  kecil(file).then(function(b64){
    return rpc('kunjunganFoto',[PHOTO_KEY,PHOTO_INFO,b64,'image/jpeg',file.name.replace(/\.[^.]+$/,'')]);
  }).then(function(r){
    var a=DATA.alamat.filter(function(x){return x.key===PHOTO_KEY})[0];
    if(a){ a.foto=r.foto; }
    if(CUR && CUR.key===PHOTO_KEY){ openSheet(CUR); }
    $('#fm').textContent='Foto tersimpan.'; render();
  }).catch(function(e){ $('#fm').textContent=e.message; });
}
$('#fCam').onchange=function(e){ unggah(e.target.files[0]); e.target.value=''; };
$('#fGal').onchange=function(e){ unggah(e.target.files[0]); e.target.value=''; };

// admin: gabung perumahan mirip
$('#cariMirip').onclick=function(){
  $('#gabung').innerHTML='<span class="spn"></span>Mencari…';
  rpc('kunjunganSaran',[]).then(function(g){
    if(!g.length){ $('#gabung').innerHTML='<p class="mu">Tidak ada nama perumahan yang mirip.</p>'; return; }
    $('#gabung').innerHTML=g.map(function(grp,gi){
      return '<div class="grp" data-g="'+gi+'">'+grp.map(function(x,xi){
        return '<label><input type="radio" name="g'+gi+'" value="'+E(x.nama)+'"'+(xi===0?' checked':'')+'>'+E(x.nama)+' <span class="mu">('+x.jumlah+' alamat)</span></label>';
      }).join('')+'<button class="b pr" style="margin-top:6px" data-gab="'+gi+'">Gabungkan ke yang dipilih</button></div>';
    }).join('');
    window.__grp=g;
  }).catch(function(e){ $('#gabung').textContent=e.message; });
};
$('#gabung').addEventListener('click',function(e){
  var gi=e.target.dataset.gab; if(gi===undefined) return;
  var g=window.__grp[+gi], pilih=document.querySelector('input[name="g'+gi+'"]:checked');
  if(!pilih) return;
  var daftar=g.map(function(x){return x.nama});
  rpc('kunjunganGabung',[daftar,pilih.value]).then(function(r){
    alert('Digabung ke "'+r.tujuan+'" ('+r.digabung+' nama).');
    load();
  }).catch(function(err){ alert(err.message); });
});

show(); if(TK) load();
})();
</script>
</body></html>
