<style>
:root{--bg:#f6f5f1;--cd:#fff;--tx:#1d1d1b;--mu:#6b6a65;--ac:#0f6e56;--ln:#e4e2db;--s0:#b91c1c;--s1:#b45309;color-scheme:light}

*{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}

.w{max-width:760px;margin:0 auto;padding:18px 14px 76px}
h1{font-size:20px;margin:0;line-height:1.25;letter-spacing:-.02em;font-weight:800;text-align:left}
h3{font-size:14px;margin:0 0 8px;font-weight:700}
.mu{color:var(--mu);font-size:13px;margin:5px 0}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.hd-right{display:flex;align-items:center;gap:8px;flex:none}
.back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:10px;height:36px;padding:0 12px;font:inherit;font-size:13px;text-decoration:none;margin-bottom:12px}
.back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib{border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:10px;min-width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:0 10px;flex:none;font:inherit;font-size:13px}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib:disabled{opacity:.5}
.lang{display:inline-flex;border:1px solid var(--ln);background:var(--cd);border-radius:10px;overflow:hidden;height:36px;flex:none}
.lang button{border:0;background:none;color:var(--mu);padding:0 10px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.lang button.on{background:var(--ac);color:#fff}
.b{border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:9px;padding:9px 13px;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.b.pr{background:var(--ac);border-color:var(--ac);color:#fff}.b:disabled{opacity:.5}
.b.danger{color:var(--s0);border-color:var(--s0)}
input,select,textarea{border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:9px;padding:9px 11px;font:inherit;font-size:14px;width:100%}
textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center}.row>*{flex:1 1 140px;min-width:0}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:8px;align-items:end}
.row3 label{min-width:0}
.row3 input,.row3 select{height:40px;padding:0 9px;font-size:13px;min-width:0;width:100%}.row>.ib,.row>.b{flex:none}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:5px;margin-bottom:14px}
.nav button{border:0;background:none;border-radius:10px;padding:8px 4px;color:var(--mu);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:inherit;font-size:12px;font-weight:500}
.nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);font-weight:600}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:11px 13px;margin:8px 0}
.card .al{font-weight:600;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11px;border:1px solid var(--ln);border-radius:9px;padding:0 7px;color:var(--mu);margin:2px 4px 0 0}
.tag.ok{color:var(--ac);border-color:var(--ac)}.tag.s1{color:var(--s1);border-color:var(--s1)}.tag.sk{color:var(--tx);background:color-mix(in srgb,var(--tx) 6%,transparent)}
.tag.btn{cursor:pointer;background:none;font:inherit;font-size:11px;color:var(--ac);border-color:var(--ac)}
.tag.btn .chev{display:inline-block;transition:transform .2s;margin-left:3px}
.tag.btn[aria-expanded=true] .chev{transform:rotate(180deg)}
.dd{border-top:1px dashed var(--ln);margin-top:8px;padding-top:8px;font-size:13px}
.dd .spo{border:1px solid var(--ln);border-radius:9px;padding:8px 10px;margin:6px 0;background:color-mix(in srgb,var(--tx) 3%,transparent)}
.dd .spo-hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:600}
.dd table{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px}
.dd td{padding:3px 0;border-bottom:1px dashed var(--ln);vertical-align:top}
.dd td.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.dd tfoot td{font-weight:700;border-bottom:0;padding-top:5px}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:8px}
.kpi .box{background:var(--cd);border:1px solid var(--ln);border-radius:11px;padding:9px 11px}
.kpi .val{font-size:18px;font-weight:700;line-height:1.2}
.kpi .lbl{font-size:12px;color:var(--mu)}
.sec{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:13px;margin-top:14px}
.bar-row{margin:10px 0}
.bar-hd{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:4px}
.bar-nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-ct{color:var(--mu);flex:none;font-variant-numeric:tabular-nums}
.bar-track{height:10px;background:color-mix(in srgb,var(--tx) 8%,transparent);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--ac);border-radius:99px;transition:width .25s ease}
.pg{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0}
.pg .mu{margin:0}
.pg .ib:disabled{opacity:.35}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chips label{border:1px solid var(--ln);background:var(--cd);border-radius:18px;padding:6px 11px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chips input{width:auto;margin:0;accent-color:var(--ac)}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.thumbs a{display:block;width:76px;height:76px;border-radius:9px;overflow:hidden;border:1px solid var(--ln);background:color-mix(in srgb,var(--tx) 6%,transparent)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.fotolist{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fotolist span{font-size:12px;border:1px solid var(--ln);border-radius:8px;padding:3px 6px 3px 9px;display:inline-flex;align-items:center;gap:6px}
.fotolist a{color:var(--ac);text-decoration:none}
.pend{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pend span{font-size:12px;border:1px solid var(--ln);border-radius:8px;padding:3px 8px;display:inline-flex;align-items:center;gap:6px}
.hapus-btn{border:1px solid var(--s0);color:var(--s0);background:none;border-radius:7px;padding:1px 8px;font:inherit;font-size:11px;font-weight:600;cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet[hidden]{display:none}
.sheet .sc{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px}
.spn{display:inline-block;width:12px;height:12px;border:2px solid var(--ln);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:7px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--s0);color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}:focus:not(:focus-visible){outline:none}

function call(fn,args){
  if(!API||/ALAMAT_ANDA/.test(API)) return Promise.reject(new Error(T().noApi));
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),redirect:'follow',credentials:'omit'})

function cocok(teks,q){
  if(!q) return true;
  var t=teks.toLowerCase();
  return q.toLowerCase().split('/').map(function(s){return s.trim()}).filter(Boolean).some(function(b){
    return b.split(/\s+/).every(function(k){return t.indexOf(k)>=0});
  });
}

function renderDash(){
  if(!DATA) return;
  var k=$('#dk').value, c=$('#dc').value, p=$('#dp').value, q=$('#dq').value.trim();
  var filtered=DATA.alamat.filter(function(a){
    if(k&&a.kota!==k) return false;
    if(c&&a.kecamatan!==c) return false;
    if(p&&a.perumahan!==p) return false;
    return cocok(a.perumahan+' '+a.alamat+' '+(a.sektor||'')+' '+a.kecamatan+' '+a.kota,q);
  });
  var map={};
  filtered.forEach(function(a){ map[a.perumahan]=(map[a.perumahan]||0)+1; });
  var ranked=Object.keys(map).map(function(nm){return {name:nm,count:map[nm]}});
  ranked.sort(function(a,b){return (b.count-a.count)||(a.name<b.name?-1:(a.name>b.name?1:0))});
  $('#dKpiAddr').textContent=filtered.length;
  $('#dKpiEst').textContent=ranked.length;
  $('#dSum').textContent=T().dashSum(ranked.length,filtered.length);
  if(!ranked.length){ $('#dChart').innerHTML='<p class="mu">'+E(T().noDash)+'</p>'; return; }
  var top=ranked.slice(0,15), max=top[0].count||1;
  $('#dChart').innerHTML=top.map(function(item){
    var pct=Math.max(4,Math.round((item.count/max)*100));
    return '<div class="bar-row"><div class="bar-hd"><span class="bar-nm" title="'+E(prmLabel(item.name))+'">'+E(prmLabel(item.name))+'</span><span class="bar-ct">'+item.count+'</span></div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div></div>';
  }).join('');
}

function filterDb(){
  var k=$('#fk').value, c=$('#fc').value, p=$('#fp').value, q=$('#q').value.trim();
  return DATA.alamat.filter(function(a){
    if(k&&a.kota!==k) return false;
    if(c&&a.kecamatan!==c) return false;
    if(p&&a.perumahan!==p) return false;
    return cocok(a.alamat+' '+a.perumahan+' '+(a.sektor||'')+' '+a.kecamatan+' '+a.kota,q);
  }).sort(function(a,b){return a.alamat<b.alamat?-1:(a.alamat>b.alamat?1:0)});
}

function pager(el,key,total,onGo){
  var pages=Math.max(1,Math.ceil(total/PS));

  el.innerHTML='<button type="button" class="ib" data-pg="-1" '+(PG[key]<=0?'disabled':'')+'><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><span>'+E(T().prev)+'</span></button>'
    +'<span class="mu">'+E(T().pageInfo(from,to,total))+'</span>'
    +'<button type="button" class="ib" data-pg="1" '+(PG[key]>=pages-1?'disabled':'')+'><span>'+E(T().next)+'</span><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>';

function parseHasil(str){
  var out={ids:[],lain:''};
  String(str||'').split(', ').forEach(function(p){
    p=p.trim(); if(!p) return;
    var hit=HASIL_CHECKLIST.filter(function(x){return x.id===p})[0];
    if(hit){ out.ids.push(p); return; }
    var m=/^(Lainnya|Other):\s*(.*)$/.exec(p);
    if(m){ out.ids.push('Lainnya'); out.lain=m[2]; return; }
    if(p==='Lainnya'||p==='Other'){ out.ids.push('Lainnya'); return; }
  });
  return out;
}

    +'<p class="mu" style="margin-top:8px">'+E(T().sekLbl)+'</p><input id="'+P+'Sk" placeholder="'+E(T().sekPh)+'" value="'+E(a.sektor||'')+'">'
    +'<p class="mu" style="margin-top:8px">'+E(T().tglLbl)+'</p><input type="date" id="'+P+'Tgl" value="'+E(a.tgl||todayIso())+'">'
    +'<p class="mu" style="margin-top:8px">'+E(T().salesLbl)+'</p><div class="chips" id="'+P+'Chips">'
      +(DATA.sales||[]).map(function(s){return '<label><input type="checkbox" value="'+E(s)+'"'+(sel.indexOf(s)>=0?' checked':'')+'>'+E(s)+'</label>'}).join('')+'</div>'
    +'<p class="mu" style="margin-top:8px">'+E(T().hasilLbl)+'</p><div class="chips" id="'+P+'Hasil">'
      +HASIL_CHECKLIST.map(function(x){return '<label><input type="checkbox" class="hsl-cb" value="'+E(x.id)+'"'+(h.ids.indexOf(x.id)>=0?' checked':'')+'>'+E(hasilLabel(x))+'</label>'}).join('')+'</div>'
    +'<div id="'+P+'LainWrap"'+(h.ids.indexOf('Lainnya')>=0?'':' hidden')+' style="margin-bottom:8px"><input id="'+P+'Lain" placeholder="'+E(T().lainnyaPh)+'" value="'+E(h.lain)+'"></div>'
    +'<p class="mu" style="margin-top:8px">'+E(T().catLbl)+'</p><textarea id="'+P+'Cat" maxlength="2000">'+E(a.catatan||'')+'</textarea>'
    +'<div class="sec" style="margin-top:10px"><h3>'+E(T().fotoTitle)+'</h3><p class="mu" style="margin-top:0">'+E(T().fotoNote)+'</p>'
      +'<div class="row"><button type="button" class="ib" data-cam="'+P+'"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg><span>'+E(T().camBtn)+'</span></button>'
      +'<button type="button" class="ib" data-gal="'+P+'"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><span>'+E(T().galBtn)+'</span></button></div>';
  if(edit && a.foto && a.foto.length){
    html+='<div class="thumbs" id="'+P+'Ex">'+a.foto.map(function(u){
      return '<div style="position:relative"><a href="'+E(u)+'" target="_blank" rel="noopener"><img src="'+E(thumb(u))+'" alt="" loading="lazy"></a>'
        +'<button type="button" class="hapus-btn" data-foto-del="'+E(u)+'" style="position:absolute;bottom:4px;left:4px;background:var(--cd)">'+E(T().delBtn2)+'</button></div>';
    }).join('')+'</div>';
  }
  html+='<div class="pend" id="'+P+'Pend"></div></div>';
  return html;
}
function pendHtml(P){
  var el=document.getElementById(P+'Pend'); if(!el) return;
  el.innerHTML=PEND_BY[P].map(function(f,i){return '<span>'+E(f.name)+' <button type="button" class="hapus-btn" data-rm="'+i+'" data-pfx="'+P+'">'+E(T().delBtn2)+'</button></span>'}).join('');
}
function bindForm(P){
  var ko=document.getElementById(P+'Ko'), kc=document.getElementById(P+'Kc');
  if(ko) ko.addEventListener('change',function(){
    var list=uniq((DATA.alamat||[]).filter(function(x){return !ko.value||x.kota===ko.value}).map(function(x){return x.kecamatan}));
    kc.innerHTML='<option value="">'+E(T().allKec)+'</option>'+list.map(function(k){return '<option value="'+E(k)+'">'+E(k)+'</option>'}).join('');
  });
  var hs=document.getElementById(P+'Hasil'), lw=document.getElementById(P+'LainWrap');
  if(hs) hs.addEventListener('change',function(){
    var cb=hs.querySelector('input.hsl-cb[value="Lainnya"]');
    if(lw){ lw.hidden=!(cb&&cb.checked); if(!(cb&&cb.checked)) document.getElementById(P+'Lain').value=''; }
  });
  pendHtml(P);
}
function collect(P){
  var sales=[].map.call(document.querySelectorAll('#'+P+'Chips input:checked'),function(i){return i.value});
  var hasil=[].map.call(document.querySelectorAll('#'+P+'Hasil input.hsl-cb:checked'),function(i){return i.value});
  var lain=(document.getElementById(P+'Lain')||{value:''}).value.trim();
  var parts=hasil.map(function(v){ return v==='Lainnya' ? (lain?(LANG==='en'?'Other: '+lain:'Lainnya: '+lain):(LANG==='en'?'Other':'Lainnya')) : v; });
  return {
    alamat:(document.getElementById(P+'Al')||{value:''}).value.trim(),
    kota:document.getElementById(P+'Ko').value.trim(),
    kecamatan:document.getElementById(P+'Kc').value.trim(),
    perumahan:document.getElementById(P+'Pr').value.trim(),
    sektor:document.getElementById(P+'Sk').value.trim(),
    tanggal:document.getElementById(P+'Tgl').value,
    sales:sales, hasil:parts.join(', '), catatan:document.getElementById(P+'Cat').value.trim()
  };
}
function validasi(it){
  if(!it.kota) return T().needCity;
  if(!it.kecamatan) return T().needKec;
  if(!it.alamat) return T().needAlamat;
  if(!it.sales.length) return T().needSales;
  return '';
}
function uploadFotos(id,files,msg){
  if(!files.length) return Promise.resolve();
  msg.innerHTML='<span class="spn"></span>'+E(T().uploading(files.length));
  return Promise.all(files.map(function(f){
    return kecil(f).then(function(b64){ return {b64:b64,mime:'image/jpeg',nama:f.name.replace(/\.[^.]+$/,'')}; });
  })).then(function(payloads){ return rpc('kunjunganFotoBatch',[id,payloads]); });
}
function simpan(P){
  var it=collect(P), msg=document.getElementById(P+'Msg'), btn=document.getElementById(P+'Save');
  var err=validasi(it); if(err){ msg.textContent=err; return; }
  var files=PEND_BY[P].slice();
  btn.disabled=true; msg.innerHTML='<span class="spn"></span>'+E(T().saving);
  var op=EDIT&&P==='e'
    ? rpc('kunjunganUbahHasil',[EDIT.id,Object.assign({},it,{sumber:EDIT.sumber})]).then(function(r){ return uploadFotos(EDIT.id,files,msg).then(function(){ return r; }); })
    : rpc('kunjunganSimpanKunjungan',[Object.assign({},it,{sumber:'Baru'})]).then(function(r){ return uploadFotos(r.id,files,msg).then(function(){ return r; }); });
  op.then(function(){
    if(P==='e'){ closeSheet(); toast(T().updated); }
    else { formMasuk(); toast(T().savedOne); }
    load(); if(TAB==='hs') loadHasil();
  }).catch(function(e){ msg.textContent=e.message; toast(e.message,true); }).then(function(){ btn.disabled=false; });
}
function formMasuk(){
  if(!DATA) return;
  $('#formMasuk').innerHTML='<div class="sec" style="margin-top:0"><h3>'+E(T().formTitle)+'</h3>'+formHtml('',{tgl:todayIso()},false)
    +'<div class="row" style="margin-top:12px"><button type="button" class="b pr" id="Save" style="width:100%">'+E(T().saveVisit)+'</button></div><p class="mu" id="Msg"></p></div>';
  PEND_BY['']=[];
  bindForm('');
  document.getElementById('Save').onclick=function(){ simpan(''); };
}

// ---------- form Edit (sheet) ----------
function openEdit(h){
  EDIT=h; PEND_BY['e']=[];
  $('#scx').innerHTML='<div class="row" style="justify-content:space-between"><h3 style="margin:0">'+E(T().editTitle)+'</h3><button type="button" class="ib" id="closeEdit">'+E(T().close)+'</button></div>'
    +formHtml('e',h,true)
    +'<div class="row" style="margin-top:12px"><button type="button" class="b pr" id="eSave" style="width:100%">'+E(T().updateBtn)+'</button></div><p class="mu" id="eMsg"></p>';
  $('#sheet').hidden=false;
  bindForm('e');
  document.getElementById('closeEdit').onclick=closeSheet;
  document.getElementById('eSave').onclick=function(){ simpan('e'); };
}
function closeSheet(){ $('#sheet').hidden=true; EDIT=null; PEND_BY['e']=[]; }
$('#sheet').addEventListener('click',function(e){ if(e.target.id==='sheet') closeSheet(); });

// ---------- pilih & hapus foto (sebelum diunggah) ----------
document.addEventListener('click',function(e){
  var mp=e.target.closest&&e.target.closest('[data-maps-from]');
  if(mp){ var P0=mp.dataset.mapsFrom, v=function(k){var el=document.getElementById(P0+k); return el?el.value.trim():'';};
    var q=[v('Al'),v('Pr'),v('Kc'),v('Ko')].filter(Boolean); if(!q.length){ toast(T().needAlamat,true); return; }
    window.open(mapsUrl(q),'_blank','noopener'); return; }
  var cam=e.target.closest&&e.target.closest('[data-cam]'); if(cam){ PFX_ACTIVE=cam.dataset.cam; $('#fCam').click(); return; }
  var gal=e.target.closest&&e.target.closest('[data-gal]'); if(gal){ PFX_ACTIVE=gal.dataset.gal; $('#fGal').click(); return; }
  var rm=e.target.closest&&e.target.closest('[data-rm]'); if(rm){ e.preventDefault(); var P=rm.dataset.pfx; PEND_BY[P].splice(+rm.dataset.rm,1); pendHtml(P); return; }
});
function pilihFoto(e){
  var P=PFX_ACTIVE, files=[].slice.call(e.target.files||[]);
  var room=MAX_FOTO-PEND_BY[P].length;
  files.slice(0,Math.max(0,room)).forEach(function(f){ PEND_BY[P].push(f); });
  if(files.length>room) toast(T().fotoMax,true);
  e.target.value='';
  pendHtml(P);
}
$('#fCam').onchange=pilihFoto; $('#fGal').onchange=pilihFoto;

// hapus foto yang sudah tersimpan (dari form edit)
$('#scx').addEventListener('click',function(e){
  var b=e.target.closest('[data-foto-del]'); if(!b||!EDIT) return;
  if(!confirm(T().photoDelConfirm)) return;
  var url=b.dataset.fotoDel;
  rpc('kunjunganHapusFoto',[EDIT.id,url]).then(function(){
    EDIT.foto=(EDIT.foto||[]).filter(function(x){return x!==url});
    var box=b.parentNode; if(box&&box.parentNode) box.parentNode.removeChild(box);
    toast(T().photoDelOk);
    if(HASIL) HASIL.forEach(function(h){ if(h.id===EDIT.id) h.foto=EDIT.foto; });
    renderHs();
  }).catch(function(err){ toast(err.message,true); });
});

// ---------- Hasil kunjungan ----------
function catatanHtml(h){
  var c=h.catatan, open=!!CAT_OPEN[h.id];
  if(c.length<=CAT_MAX) return '<p class="mu" style="margin:6px 0 0;white-space:pre-line">'+E(c)+'</p>';
  var shown=open?c:c.slice(0,CAT_MAX).replace(/\s+\S*$/,'')+'…';
  return '<p class="mu" style="margin:6px 0 0;white-space:pre-line">'+E(shown)+' <button type="button" data-cat="'+E(h.id)+'" style="border:0;background:none;color:var(--ac);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:0">'+E(open?T().less:T().more)+'</button></p>';
}
$('#listHs').addEventListener('click',function(e){
  var c=e.target.closest('[data-cat]'); if(!c) return;
  CAT_OPEN[c.dataset.cat]=!CAT_OPEN[c.dataset.cat]; renderHs();
});
function renderHs(){
  if(!HASIL) return;
  var q=$('#qHs').value.trim(), fs=$('#hsSales').value, fd=$('#hsDari').value, fsp=$('#hsSampai').value;
  FIL.hs=HASIL.filter(function(h){
    if(fs && h.sales.indexOf(fs)<0) return false;
    if(fd && h.tgl < fd) return false;
    if(fsp && h.tgl > fsp) return false;
    return cocok(h.alamat+' '+h.perumahan+' '+(h.sektor||'')+' '+h.kecamatan+' '+h.kota+' '+h.sales.join(' ')+' '+h.hasil+' '+h.catatan,q);
  });
  $('#sumHs').textContent=T().hsSum(FIL.hs.length);
  var list=FIL.hs.slice(PG.hs*PS,PG.hs*PS+PS);
  $('#listHs').innerHTML='<div id="top-hs"></div>'+(list.map(function(h){
    return '<div class="card" data-id="'+E(h.id)+'"><div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center"><span class="tag ok" style="margin:0;flex:none;width:auto;display:inline-block;white-space:nowrap">'+E(tglPanjang(h.tgl))+'</span></div>'
      +'<div class="al" style="margin-top:4px">'+E(h.alamat)+'</div><div class="mu">'+E([prmLabel(h.perumahan),h.kecamatan,h.kota].filter(Boolean).join(' · '))+'</div>'
      +(h.sumber==='Baru'?'<p style="margin:4px 0 0"><a class="tag s1" href="'+E(mapsUrl([h.alamat,prmAsli(h.perumahan),h.kecamatan,h.kota]))+'" target="_blank" rel="noopener">'+PIN+' '+E(T().lihatMaps)+'</a></p>':'')
      +'<div>'+(h.sektor?'<span class="tag sk">'+E(h.sektor)+'</span>':'')+h.sales.map(function(s){return '<span class="tag">'+E(s)+'</span>'}).join('')+(h.hasil?'<span class="tag">'+E(h.hasil)+'</span>':'')+'</div>'
      +(h.catatan?catatanHtml(h):'')
      +(h.foto.length?'<div class="thumbs">'+h.foto.map(function(u){return '<a href="'+E(u)+'" target="_blank" rel="noopener"><img src="'+E(thumb(u))+'" alt="" loading="lazy"></a>'}).join('')+'</div>':'')
      +'<div class="row" style="margin:8px 0 0"><button type="button" class="b" data-edit="'+E(h.id)+'">'+E(T().editBtn)+'</button><button type="button" class="b danger" data-del="'+E(h.id)+'">'+E(T().delBtn)+'</button></div>'
      +'</div>';
  }).join('')||'<p class="mu">'+E(T().noHs)+'</p>');
  pager($('#pgHs'),'hs',FIL.hs.length,renderHs);
}
$('#listHs').addEventListener('click',function(e){
  var ed=e.target.closest('[data-edit]');
  if(ed){ var h=HASIL.filter(function(x){return x.id===ed.dataset.edit})[0]; if(h) openEdit(h); return; }
  var del=e.target.closest('[data-del]');
  if(del){
    if(!confirm(T().delConfirm)) return;
    var id=del.dataset.del;
    rpc('kunjunganHapusHasil',[id]).then(function(){
      HASIL=HASIL.filter(function(x){return x.id!==id}); toast(T().delOk); renderHs(); load();
    }).catch(function(err){ toast(err.message,true); });
  }
});

// ---------- kecilkan foto di browser sebelum diunggah ----------
function kecil(file){
  return new Promise(function(res,rej){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var m=1280, s=Math.min(1,m/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.75).split(',')[1]);
    };
    img.onerror=function(){ rej(new Error(T().badImg)) }; img.src=url;
  });
}

// Tombol back Android: tekan pertama minta konfirmasi, tekan kedua (dalam 2 detik) kembali ke Monitoring
(function(){
  var armed=false, timer=null, fallback=null;
  history.pushState({knApp:1},'');
  window.addEventListener('popstate', function(e){
    if(e.state && e.state.knApp) return;
    if(armed){
      clearTimeout(timer); armed=false;
      history.back();
      fallback=setTimeout(function(){ location.href='../'; },400);
      return;
    }
    history.go(1);
    armed=true;
    toast(T().backConfirm);
    timer=setTimeout(function(){ armed=false; },2000);
  });
})();

applyLang(); show(); if(TK) load(); setTab('ds');
})();
