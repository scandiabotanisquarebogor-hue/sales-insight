<!DOCTYPE html>

<style>
:root{--bg:#f6f5f1;--cd:#fff;--tx:#1d1d1b;--mu:#6b6a65;--ac:#0f6e56;--ln:#e4e2db;--s0:#b91c1c;--s1:#b45309;--logo-filter:none;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--cd:#212120;--tx:#efeee9;--mu:#9a9990;--ac:#3fb98f;--ln:#34342f;--s0:#f87171;--s1:#fbbf24;--logo-filter:invert(1) brightness(1.05);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.val{font-family:"Plus Jakarta Sans","Inter",system-ui,-apple-system,sans-serif}
.w{max-width:760px;margin:0 auto;padding:20px 14px 76px}
h1{font-size:20px;margin:0;line-height:1.25;letter-spacing:-.02em;font-weight:800}h3{font-size:14px;margin:0 0 8px;font-weight:700}.mu{color:var(--mu);font-size:13px;margin:5px 0}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;padding-top:4px}
.hd-right{display:flex;align-items:center;gap:8px;flex:none}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-title{display:flex;flex-direction:column;justify-content:center;gap:2px}
.brand-logo{height:38px;width:auto;max-width:128px;object-fit:contain;filter:var(--logo-filter);flex:none}
.ib{border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:10px;min-width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:0 10px;flex:none;font:inherit;font-size:13px}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib.on{color:var(--ac);border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,var(--cd))}
.ib:disabled{opacity:.5}
.lang{display:inline-flex;border:1px solid var(--ln);background:var(--cd);border-radius:10px;overflow:hidden;height:40px;flex:none}
.lang button{border:0;background:none;color:var(--mu);padding:0 10px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.lang button.on{background:var(--ac);color:#fff}
.b{border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:9px;padding:9px 13px;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.b.pr{background:var(--ac);border-color:var(--ac);color:#fff}.b:disabled{opacity:.5}
input,select,textarea{border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:9px;padding:9px 11px;font:inherit;font-size:14px;width:100%}
textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center}.row>*{flex:1 1 140px;min-width:0}.row>.ib,.row>.b{flex:none}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:5px;margin-bottom:14px}
.nav button{border:0;background:none;border-radius:10px;padding:8px 4px;color:var(--mu);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:inherit;font-size:12px;font-weight:500}
.nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);font-weight:600}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:11px 13px;margin:8px 0;display:flex;gap:11px;align-items:flex-start}
.card.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 5%,var(--cd))}
.card .inf{flex:1;min-width:0}
.card .inf.click{cursor:pointer}
.card .al{font-weight:600;overflow-wrap:anywhere}
.sel-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none;padding-top:1px}
.sel-wrap input[type=checkbox]{width:22px;height:22px;margin:0;accent-color:var(--ac);cursor:pointer}
.sel-lbl{font-size:10px;font-weight:600;color:var(--mu);letter-spacing:.03em;text-transform:uppercase}
.tag{display:inline-block;font-size:11px;border:1px solid var(--ln);border-radius:9px;padding:0 7px;color:var(--mu);margin:2px 4px 0 0}
.tag.ok{color:var(--ac);border-color:var(--ac)}.tag.s1{color:var(--s1);border-color:var(--s1)}.tag.sk{color:var(--tx);background:color-mix(in srgb,var(--tx) 6%,transparent)}
.batch-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:color-mix(in srgb,var(--ac) 10%,var(--cd));border:1px solid var(--ac);border-radius:12px;padding:9px 12px;margin-bottom:10px}
.batch-bar strong{font-size:13px;color:var(--ac)}
.batch-acts{display:flex;gap:6px;flex-wrap:wrap}
.sel-preview{max-height:130px;overflow:auto;background:var(--cd);border:1px solid var(--ln);border-radius:9px;padding:8px 10px;margin:6px 0 10px;font-size:12px}
.sel-preview div{padding:3px 0;border-bottom:1px dashed var(--ln)}
.sel-preview div:last-child{border-bottom:0}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:8px}
.kpi .box{background:var(--cd);border:1px solid var(--ln);border-radius:11px;padding:9px 11px}
.kpi .val{font-size:18px;font-weight:700;line-height:1.2}
.kpi .lbl{font-size:12px;color:var(--mu)}
.bar-row{margin:10px 0}
.bar-hd{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:4px}
.bar-nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-ct{color:var(--mu);flex:none;font-variant-numeric:tabular-nums}
.bar-track{height:10px;background:color-mix(in srgb,var(--tx) 8%,transparent);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--ac);border-radius:99px;transition:width .25s ease}
.pg{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0}
.pg .mu{margin:0}
.pg .ib:disabled{opacity:.35}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet[hidden]{display:none}
.sheet .sc{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chips label{border:1px solid var(--ln);background:var(--cd);border-radius:18px;padding:6px 11px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chips input{width:auto;margin:0;accent-color:var(--ac)}
.sec{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:13px;margin-top:14px}
.pend{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pend span{font-size:12px;border:1px solid var(--ln);border-radius:8px;padding:3px 8px}
.spn{display:inline-block;width:12px;height:12px;border:2px solid var(--ln);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:7px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--s0);color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}:focus:not(:focus-visible){outline:none}
</style></head><body>
<div class="w">
  <div class="hd">
    <div class="brand">
      <img class="brand-logo" src="./logo.png" alt="SCANDIA Lifestyle &amp; Home">

      <button type="button" class="ib" id="out" hidden><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span id="lblOut">Keluar</span></button>

  <section id="login" class="sec" style="margin-top:4px">

  </section>

  <section id="app" hidden>

      <button type="button" data-t="ds" class="on" title="Dashboard" aria-label="Dashboard">

        <span data-nav="ds">Dashboard</span>

      <button type="button" data-t="db" title="Database" aria-label="Database">

      </button>
      <button type="button" data-t="kj" title="Kunjungan" aria-label="Kunjungan">

        <span data-nav="hs">Hasil</span>
      </button>

    <section id="tDs">

      </div>

        <p class="mu" id="dSum"></p>

    <section id="tDb" hidden>
      <div class="row">

        <select id="fc" aria-label="Kecamatan"></select>

        <input id="q" placeholder="Cari alamat, perumahan, sektor/blok/cluster… pisah dengan /" style="flex:1 1 200px">
        <button type="button" class="ib" id="reload"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg><span class="lblReload">Muat Ulang</span></button>
        <button type="button" class="ib" id="rebuild"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3"/><path d="M4 11v6c0 1.7 3.6 3 8 3"/><path d="M16 14v6M13 17l3 3 3-3"/></svg><span id="lblRebuild">Perbarui DB</span></button>
      </div>
      <p class="mu" id="sum"></p>
      <div id="listDb"></div>
      <div class="pg" id="pgDb"></div>
    </section>

    <section id="tKj" hidden>

        <button type="button" class="ib on" id="kjDb"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg><span id="lblKjDb">Dari Database</span></button>

      <div id="kjDbPane">

        <div id="listKj"></div>
        <div class="pg" id="pgKj"></div>
      </div>
      <div id="kjBaruPane" hidden>
        <div id="formBaru"></div>
      </div>
    </section>

    <section id="tHs" hidden>
      <div class="kpi">
        <div class="box"><div class="val" id="kpiTotal">0</div><div class="lbl" id="lblKpiTotal">Total Kunjungan</div></div>
        <div class="box"><div class="val" id="kpiUnik">0</div><div class="lbl" id="lblKpiUnik">Alamat Unik</div></div>
      </div>
      <div class="row">
        <select id="hsSales" aria-label="Filter Sales"></select>
        <input type="date" id="hsDari" aria-label="Dari tanggal">
        <input type="date" id="hsSampai" aria-label="Sampai tanggal">
      </div>
      <div class="row"><input id="qHs" placeholder="Cari alamat, perumahan, sektor/blok/cluster, hasil, catatan… pisah dengan /" style="flex:1 1 200px"></div>
      <p class="mu" id="sumHs"></p>
      <div id="listHs"></div>
      <div class="pg" id="pgHs"></div>
    </section>
  </section>
</div>

<div class="sheet" id="sheet" hidden><div class="sc" id="scx"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fGal" accept="image/*" multiple hidden>

function call(fn,args){
  if(!API||/ALAMAT_ANDA/.test(API)) return Promise.reject(new Error(T().noApi));
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),redirect:'follow',credentials:'omit'})
    .catch(function(){throw new Error(T().noNet)})
    .then(function(r){return r.json().catch(function(){throw new Error(T().badRes)})})
    .then(function(j){ if(!j.ok){ if(/Sesi/i.test(j.e||'')) logout(true); throw new Error(j.e||'Error'); } return j.v; });
}

function cocok(teks,q){
  if(!q) return true;
  var t=teks.toLowerCase();
  return q.toLowerCase().split('/').map(function(s){return s.trim()}).filter(Boolean).some(function(b){
    return b.split(/\s+/).every(function(k){return t.indexOf(k)>=0});
  });
}

function cmpName(a,b){
  return a.name<b.name?-1:(a.name>b.name?1:0);
}
function renderDash(){
  if(!DATA) return;
  var k=$('#dk').value, c=$('#dc').value, p=$('#dp').value, q=$('#dq').value.trim();
  var filtered=DATA.alamat.filter(function(a){
    if(k&&a.kota!==k) return false;
    if(c&&a.kecamatan!==c) return false;
    if(p&&a.perumahan!==p) return false;
    return cocok(a.perumahan+' '+a.alamat+' '+(a.sektor||'')+' '+a.kecamatan+' '+a.kota,q);
  });
  var map={};
  filtered.forEach(function(a){
    var nm=(a.perumahan||'').trim()||(LANG==='en'?'Non-Estate / Unspecified':'Non-Perumahan / Belum Diisi');
    map[nm]=(map[nm]||0)+1;
  });
  var ranked=Object.keys(map).map(function(nm){return {name:nm,count:map[nm]}});
  ranked.sort(function(a,b){return (b.count-a.count)||cmpName(a,b)});
  $('#dKpiAddr').textContent=filtered.length;
  $('#dKpiEst').textContent=ranked.length;
  $('#dSum').textContent=T().dashSum(ranked.length,filtered.length);
  if(!ranked.length){ $('#dChart').innerHTML='<p class="mu">'+E(T().noDash)+'</p>'; return; }
  var top=ranked.slice(0,15), max=top[0].count||1;
  $('#dChart').innerHTML=top.map(function(item){
    var pct=Math.max(4,Math.round((item.count/max)*100));
    return '<div class="bar-row"><div class="bar-hd"><span class="bar-nm" title="'+E(item.name)+'">'+E(item.name)+'</span><span class="bar-ct">'+item.count+'</span></div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div></div>';
  }).join('');
}

function filterDb(){
  var k=$('#fk').value, c=$('#fc').value, p=$('#fp').value, sk=$('#fsk').value, q=$('#q').value.trim();
  return DATA.alamat.filter(function(a){
    if(k&&a.kota!==k) return false;
    if(c&&a.kecamatan!==c) return false;
    if(p&&a.perumahan!==p) return false;
    if(sk&&a.sektor!==sk) return false;
    return cocok(a.alamat+' '+a.perumahan+' '+(a.sektor||'')+' '+a.kecamatan+' '+a.kota,q);
  }).sort(function(a,b){return a.alamat<b.alamat?-1:(a.alamat>b.alamat?1:0)});
}

function pager(el,key,total,onGo){
  var pages=Math.max(1,Math.ceil(total/PS));
  if(PG[key]>=pages) PG[key]=pages-1; if(PG[key]<0) PG[key]=0;
  if(total<=PS){ el.innerHTML=''; return; }
  var from=PG[key]*PS+1, to=Math.min(total,(PG[key]+1)*PS);
  el.innerHTML='<button type="button" class="ib" data-pg="-1" '+(PG[key]<=0?'disabled':'')+'><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><span>'+E(T().prev)+'</span></button>'
    +'<span class="mu">'+E(T().pageInfo(from,to,total))+'</span>'
    +'<button type="button" class="ib" data-pg="1" '+(PG[key]>=pages-1?'disabled':'')+'><span>'+E(T().next)+'</span><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>';
  el.onclick=function(e){
    var b=e.target.closest('button[data-pg]'); if(!b||b.disabled) return;
    PG[key]+=+b.dataset.pg; onGo(); var top=document.getElementById('top-'+key); if(top) top.scrollIntoView({block:'start'});
  };
}

      +'<div class="row">'
        +'<div style="flex:1 1 160px"><p class="mu" style="margin:0 0 4px">'+E(T().cityLbl)+'</p><select id="fKo"><option value="">'+E(T().allCity)+'</option>'+cities.map(function(c){return '<option value="'+E(c)+'"'+(c===initCity?' selected':'')+'>'+E(c)+'</option>'}).join('')+'</select></div>'
        +'<div style="flex:1 1 160px"><p class="mu" style="margin:0 0 4px">'+E(T().kecLbl)+'</p><select id="fKc"><option value="">'+E(T().allKec)+'</option>'+kecList.map(function(k){return '<option value="'+E(k)+'"'+(k===initKec?' selected':'')+'>'+E(k)+'</option>'}).join('')+'</select></div>'
      +'</div>'
      +'<div class="row">'
        +'<div style="flex:1 1 100%"><p class="mu" style="margin:0 0 4px">'+E(T().perLbl)+'</p><input id="fPr" placeholder="'+E(T().perPh)+'" value="'+E(a.perumahan||'')+'"></div>'
      +'</div>'
      +'<div class="row">'
        +'<div style="flex:1 1 100%"><p class="mu" style="margin:0 0 4px">'+E(T().addrOptLbl)+'</p><input id="fAl" placeholder="'+E(T().addrOptPh)+'" value="'+E(a.alamat||'')+'"></div>'
      +'</div>';
  }else if(mode==='batch'){
    headerBlock='<p class="mu" style="margin-top:0">'+E(T().selectedListLbl)+'</p><div class="sel-preview">'+BATCH_LIST.map(function(it){
      return '<div><strong>'+E(it.alamat||it.perumahan||it.kecamatan)+'</strong> <span class="mu">('+E([it.perumahan,it.kecamatan,it.kota].filter(Boolean).join(' · ')||'-')+')</span></div>';
    }).join('')+'</div>';
  }else{
    headerBlock='<div class="al" style="font-weight:600">'+E(a.alamat)+'</div><p class="mu">'+E([a.perumahan,a.kecamatan,a.kota].filter(Boolean).join(' · '))+'</p>';
  }

  return headerBlock
    +inputSektor
    +'<p class="mu" style="margin-top:8px">'+E(T().tglLbl)+'</p><input type="date" id="fTgl" value="'+todayIso()+'">'
    +'<p class="mu" style="margin-top:8px">'+E(T().salesLbl)+'</p><div class="chips" id="chips">'+chipsHtml([])+'</div>'
    +'<p class="mu" style="margin-top:8px">'+E(T().hasilLbl)+'</p><div class="chips" id="hasilChips">'+hasilChecklistHtml([])+'</div>'
    +'<div id="fLainnyaWrap" hidden style="margin-bottom:8px"><input id="fLainnya" placeholder="'+E(T().lainnyaPh)+'"></div>'
    +'<p class="mu" style="margin-top:8px">'+E(T().catLbl)+'</p><textarea id="fCat" maxlength="500"></textarea>'
    +'<div class="sec" style="margin-top:10px"><h3>'+E(T().fotoTitle)+'</h3><div class="row"><button type="button" class="ib" id="bCam"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg><span>'+E(T().camBtn)+'</span></button><button type="button" class="ib" id="bGal"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><span>'+E(T().galBtn)+'</span></button></div><div class="pend" id="pend"></div></div>';
}

function syncLainnyaField(){
  var wrap=$('#fLainnyaWrap');
  var cb=document.querySelector('#hasilChips input.hsl-cb[value="Lainnya"]');
  if(!wrap||!cb) return;
  wrap.hidden=!cb.checked;
  if(!cb.checked && $('#fLainnya')) $('#fLainnya').value='';
}

function pendHtml(){ $('#pend').innerHTML=PEND.map(function(f,i){return '<span>'+E(f.name)+' <a href="#" data-rm="'+i+'" style="color:var(--s0);text-decoration:none">✕</a></span>'}).join(''); }
function openForm(a){
  CUR=a; BATCH_LIST=[]; PEND=[];
  $('#scx').innerHTML='<div class="row" style="justify-content:space-between"><h3 style="margin:0">'+E(T().singleVisitTitle)+'</h3><button type="button" class="ib" id="x"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg><span>'+E(T().close)+'</span></button></div>'
    +formFields(a,'single')
    +'<div class="row" style="margin-top:12px"><button type="button" class="b pr" id="simpan" style="width:100%">'+E(T().saveVisit)+'</button></div><p class="mu" id="sm"></p>';
  $('#sheet').hidden=false; bindForm('single');
}
function openBatchForm(list){
  CUR=null; BATCH_LIST=list.slice(); PEND=[];
  $('#scx').innerHTML='<div class="row" style="justify-content:space-between"><h3 style="margin:0">'+E(T().batchVisitTitle(BATCH_LIST.length))+'</h3><button type="button" class="ib" id="x"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg><span>'+E(T().close)+'</span></button></div>'
    +formFields({},'batch')
    +'<div class="row" style="margin-top:12px"><button type="button" class="b pr" id="simpan" style="width:100%">'+E(T().saveVisit)+'</button></div><p class="mu" id="sm"></p>';
  $('#sheet').hidden=false; bindForm('batch');
}
function bindForm(mode){
  $('#x') && ($('#x').onclick=closeSheet);
  $('#bCam').onclick=function(){ $('#fCam').click(); };
  $('#bGal').onclick=function(){ $('#fGal').click(); };
  if($('#hasilChips')){
    $('#hasilChips').addEventListener('change',syncLainnyaField);
  }
  if(mode==='baru' && $('#fKo')){
    $('#fKo').addEventListener('change',function(){ rebuildBaruKec(''); });
  }
  var btn=$(mode==='baru'?'#simpanBaru':'#simpan');
  if(btn) btn.onclick=function(){ saveVisit(mode); };
  syncLainnyaField();
  pendHtml();
}
function closeSheet(){ $('#sheet').hidden=true; CUR=null; BATCH_LIST=[]; PEND=[]; }
$('#sheet').addEventListener('click',function(e){ if(e.target.id==='sheet') closeSheet(); });
$('#scx').addEventListener('click',function(e){ var rm=e.target.dataset.rm; if(rm===undefined) return; e.preventDefault(); PEND.splice(+rm,1); pendHtml(); });
function pilihFoto(e){ [].forEach.call(e.target.files,function(f){ if(PEND.length<10) PEND.push(f); }); e.target.value=''; pendHtml(); }
$('#fCam').onchange=pilihFoto; $('#fGal').onchange=pilihFoto;

function uploadPhotosIfAny(targetId, files, msgEl){
  if(!files.length) return Promise.resolve();
  msgEl.innerHTML='<span class="spn"></span>'+E(T().uploading(files.length));
  return Promise.all(files.map(function(f){
    return kecil(f).then(function(b64){
      return { b64: b64, mime: 'image/jpeg', nama: f.name.replace(/\.[^.]+$/,'') };
    });
  })).then(function(payloads){
    return rpc('kunjunganFotoBatch',[targetId, payloads]);
  });
}

function collectHasilText(){
  var checked=[].map.call(document.querySelectorAll('#hasilChips input.hsl-cb:checked'),function(i){return i.value});
  var lainnyaTxt=($('#fLainnya')&&$('#fLainnya').value.trim())||'';
  var parts=[];
  checked.forEach(function(v){
    if(v==='Lainnya'){
      parts.push(lainnyaTxt?(LANG==='en'?'Other: '+lainnyaTxt:'Lainnya: '+lainnyaTxt):(LANG==='en'?'Other':'Lainnya'));
    }else{
      parts.push(v);
    }
  });
  return parts.join(', ');
}

function saveVisit(mode){
  var sales=[].map.call(document.querySelectorAll('#chips input:checked'),function(i){return i.value});
  var sk=($('#fSk')&&$('#fSk').value.trim())||'';
  var tgl=$('#fTgl').value, hasil=collectHasilText(), catatan=$('#fCat').value.trim();
  var btn=$(mode==='baru'?'#simpanBaru':'#simpan'), msg=$(mode==='baru'?'#smBaru':'#sm'), files=PEND.slice();

  if(mode==='baru'){
    var ko=$('#fKo')?$('#fKo').value.trim():'';
    var kc=$('#fKc')?$('#fKc').value.trim():'';
    if(!ko){ msg.textContent=T().needCity; return; }
    if(!kc){ msg.textContent=T().needKec; return; }
  }
  if(!sales.length){ msg.textContent=T().needSales; return; }

  if(mode==='batch'){
    if(!BATCH_LIST.length) return;
    var items=BATCH_LIST.map(function(a){
      return {alamat:a.alamat,kota:a.kota,kecamatan:a.kecamatan,perumahan:a.perumahan,sektor:sk,sumber:'Database',tanggal:tgl,sales:sales,hasil:hasil,catatan:catatan};
    });
    btn.disabled=true; msg.innerHTML='<span class="spn"></span>'+E(T().saving);
    rpc('kunjunganSimpanBatch',[items]).then(function(r){
      return uploadPhotosIfAny(r.firstId, files, msg).then(function(){ return r; });
    }).then(function(r){
      SEL_KEYS={}; closeSheet();
      toast(T().savedBatch(r.jumlah)); load(); if(TAB==='hs') loadHasil();
    }).catch(function(e){ msg.textContent=e.message; toast(e.message,true); }).then(function(){ btn.disabled=false; });
    return;
  }

  var it=mode==='baru'
    ? {alamat:$('#fAl').value.trim(),kota:$('#fKo').value.trim(),kecamatan:$('#fKc').value.trim(),perumahan:$('#fPr').value.trim(),sektor:sk,sumber:'Baru'}
    : {alamat:CUR.alamat,kota:CUR.kota,kecamatan:CUR.kecamatan,perumahan:CUR.perumahan,sektor:sk,sumber:'Database'};
  it.tanggal=tgl; it.sales=sales; it.hasil=hasil; it.catatan=catatan;

  btn.disabled=true; msg.innerHTML='<span class="spn"></span>'+E(T().saving);
  rpc('kunjunganSimpanKunjungan',[it]).then(function(r){
    return uploadPhotosIfAny(r.id, files, msg);
  }).then(function(){
    if(mode==='baru'){ formBaru(); PEND=[]; }
    else closeSheet();
    toast(T().savedOne); load(); if(TAB==='hs') loadHasil();
  }).catch(function(e){ msg.textContent=e.message; toast(e.message,true); }).then(function(){ btn.disabled=false; });
}

function formBaru(){
  var a={alamat:'',kota:'',kecamatan:'',perumahan:'',sektor:''};
  $('#formBaru').innerHTML='<div class="sec" style="margin-top:0"><h3>'+E(T().newAddrTitle)+'</h3>'+formFields(a,'baru')
    +'<div class="row" style="margin-top:12px"><button type="button" class="b pr" id="simpanBaru" style="width:100%">'+E(T().saveVisit)+'</button></div><p class="mu" id="smBaru"></p></div>';
  CUR=null; BATCH_LIST=[]; PEND=[];
  bindForm('baru');
}

function renderHs(){
  if(!HASIL) return;
  var q=$('#qHs').value.trim(), fs=$('#hsSales').value, fd=$('#hsDari').value, fsp=$('#hsSampai').value;
  FIL.hs=HASIL.filter(function(h){
    if(fs && h.sales.indexOf(fs)<0) return false;
    if(fd && h.tgl < fd) return false;
    if(fsp && h.tgl > fsp) return false;
    return cocok(h.alamat+' '+h.perumahan+' '+(h.sektor||'')+' '+h.kecamatan+' '+h.kota+' '+h.sales.join(' ')+' '+h.hasil+' '+h.catatan,q);
  });
  var unikAlamat=new Set(FIL.hs.map(function(h){return h.key})).size;
  $('#kpiTotal').textContent=FIL.hs.length;
  $('#kpiUnik').textContent=unikAlamat;
  $('#sumHs').textContent=T().hsSum(FIL.hs.length);
  var list=FIL.hs.slice(PG.hs*PS,PG.hs*PS+PS);
  $('#listHs').innerHTML='<div id="top-hs"></div>'+(list.map(function(h){
    return '<div class="card" style="display:block"><div class="row" style="justify-content:space-between;margin:0"><span class="tag ok" style="margin:0">'+E(tglTxt(h.tgl))+'</span>'+(h.sumber==='Baru'?'<span class="tag s1">'+E(T().newAddrTag)+'</span>':'')+'</div>'
      +'<div class="al" style="margin-top:4px">'+E(h.alamat)+'</div><div class="mu">'+E([h.perumahan,h.kecamatan,h.kota].filter(Boolean).join(' · '))+'</div>'
      +'<div>'+(h.sektor?'<span class="tag sk">'+E(h.sektor)+'</span>':'')+h.sales.map(function(s){return '<span class="tag">'+E(s)+'</span>'}).join('')+(h.hasil?'<span class="tag">'+E(h.hasil)+'</span>':'')+'</div>'
      +(h.catatan?'<p class="mu" style="margin:6px 0 0">'+E(h.catatan)+'</p>':'')
      +(h.foto.length?'<p style="margin:6px 0 0">'+h.foto.map(function(u,i){return '<a href="'+E(u)+'" target="_blank" rel="noopener" style="font-size:13px;color:var(--ac);margin-right:10px">'+E(T().photoLink(i+1))+'</a>'}).join('')+'</p>':'')
      +'</div>';
  }).join('')||'<p class="mu">'+E(T().noHs)+'</p>');
  pager($('#pgHs'),'hs',FIL.hs.length,renderHs);
}

function kecil(file){
  return new Promise(function(res,rej){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var m=1280, s=Math.min(1,m/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.75).split(',')[1]);
    };
    img.onerror=function(){ rej(new Error(T().badImg)) }; img.src=url;
  });
}

applyLang(); show(); if(TK) load(); setTab('ds');
})();
</script>
</body></html>
